name: Sincronizar Excel con Supabase

on:
  # 1. Se ejecuta automáticamente cada vez que modifiques el Excel
  push:
    branches:
      - main
    paths:
      - '2026_2027_deudas_hermanos.xlsx'

  # 2. Se ejecuta una vez a la semana (todos los lunes a las 08:00 AM UTC)
  schedule:
    - cron: '0 8 * * 1'

  # 3. Mantiene la opción de ejecutarlo manualmente
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl supabase

      - name: Ejecutar script de sincronización
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python process_excel.py
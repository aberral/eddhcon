name: Sincronizar Excel con Supabase

on:
  workflow_dispatch: # Permite ejecutar la sincronización manualmente con un botón
  push:
    branches:
      - main           # Se ejecuta automáticamente cada vez que subes un nuevo Excel a 'main'
  schedule:
    - cron: '0 8 * * *' # Opcional: Se ejecuta automáticamente todos los días a las 8:00 AM

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl supabase

      - name: Ejecutar script de sincronización
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python process_excel.py
name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta a las 00:00 UTC cada 5 días
    - cron: '0 0 */5 * *'
  # Permite ejecutar el flujo manualmente desde GitHub para probarlo
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar petición GET a la API de Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Deudas - El Desprecio de Herodes</title>
  <link rel="icon" type="image/x-icon" href="logo.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 space-y-5">
    
    <div class="flex flex-col items-center text-center border-b border-slate-700/60 pb-4">
      <img src="logo.ico" alt="Escudo Hermandad" class="h-20 w-auto object-contain drop-shadow-md mb-2">
      <h1 class="text-xl font-bold text-white tracking-wide">El Desprecio de Herodes</h1>
      <p class="text-xs text-blue-400 font-medium uppercase tracking-wider">Primero de la Guía</p>
    </div>

    <div id="view-login" class="space-y-4 pt-1">
      <p class="text-xs text-slate-400 text-center">Introduce tus credenciales para acceder al portal</p>
      <input id="email" type="email" placeholder="Correo electrónico" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      <input id="password" type="password" placeholder="Contraseña" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      <button onclick="login()" class="w-full bg-blue-600 font-bold p-3 rounded-xl hover:bg-blue-500 transition text-sm">Entrar</button>
      <p id="login-error" class="text-red-400 text-sm text-center hidden"></p>
    </div>

    <div id="view-dashboard" class="hidden space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700/60 pb-3">
        <div>
          <span class="text-xs text-slate-400">Hermano registrado:</span>
          <h3 class="text-base font-bold text-white" id="user-name">...</h3>
        </div>
        <button onclick="logout()" class="text-xs text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg hover:bg-red-500/10">Salir</button>
      </div>

      <div class="bg-blue-950/60 border border-blue-500/30 p-4 rounded-xl text-center">
        <span class="text-xs font-bold text-blue-300 uppercase tracking-wider">Estado / Saldo Acumulado</span>
        <div id="total-saldo" class="text-3xl font-extrabold text-green-400 mt-1">0.00 €</div>
      </div>

      <div class="bg-slate-900/80 border border-slate-700 p-3.5 rounded-xl text-xs space-y-2 text-slate-300">
        <div class="flex items-center gap-1.5 font-semibold text-blue-400">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span>Información para pagos</span>
        </div>
        <p>Te recuerdo que el número de cuenta donde domiciliar la cuota para mayor comodidad es:</p>
        <div class="bg-slate-950 p-2 rounded border border-slate-800 font-mono text-center
